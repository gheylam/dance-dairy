services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dance_dairy}
      POSTGRES_USER: ${POSTGRES_USER:-dance_dairy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dance_dairy}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dance_dairy} -d $${POSTGRES_DB:-dance_dairy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
